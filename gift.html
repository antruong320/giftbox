<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030303">

<title>GiftBox ❤️</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box
}

body{
  margin:0;
  background:#030303;
  color:#fff;
  font-family:Inter,system-ui,-apple-system,sans-serif;
  overflow:hidden;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  opacity:.2;
}

.wrap{
  position:relative;
  z-index:2;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
}

.box{
  width:min(800px,100%);
}

.small{
  color:#bbb;
  font-size:18px;
}

.title{
  font-size:clamp(42px,12vw,90px);
  font-weight:900;
  line-height:1.02;
  text-shadow:
    0 0 20px #fff,
    0 0 55px #aaa;
  margin:20px 0 28px;
}

.btn{
  padding:16px 28px;
  border:0;
  border-radius:15px;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
  background:#fff;
  color:#111;
  -webkit-tap-highlight-color:transparent;
}

.btn:active{
  transform:scale(.94);
}

.hidden{
  display:none!important;
}

.msg{
  font-size:20px;
  line-height:1.75;
  white-space:pre-line;
  margin:20px auto;
  max-width:650px;
}

.photo{
  display:block;
  max-width:min(430px,90vw);
  max-height:40vh;
  object-fit:contain;
  border-radius:22px;
  margin:15px auto;
  box-shadow:0 0 40px #ffffff22;
}

.audio{
  width:min(430px,90vw);
  margin:15px auto;
}

.heart{
  position:fixed;
  bottom:-30px;
  font-size:28px;
  z-index:4;
  animation:up 5s linear forwards;
  pointer-events:none;
}

@keyframes up{
  to{
    transform:
      translateY(-115vh)
      rotate(35deg)
      scale(1.7);
    opacity:0;
  }
}

.error{
  color:#ff9999;
  background:#300d0d;
  padding:18px;
  border-radius:15px;
  margin-top:20px;
}

.loading{
  color:#bbb;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<main class="wrap">

  <!-- Loading -->
  <div class="box loading" id="loading">
    Đang chuẩn bị món quà... ✨
  </div>

  <!-- Gift -->
  <div class="box hidden" id="gift">

    <div class="small">
      💌 Một món quà dành riêng cho
    </div>

    <div id="title" class="title"></div>

    <button id="openBtn" class="btn">
      Mở món quà 🎁
    </button>

    <div id="content" class="hidden">

      <img
        id="photo"
        class="photo hidden"
        alt="Ảnh món quà"
      >

      <div id="msg" class="msg"></div>

      <audio
        id="audio"
        class="audio hidden"
        controls
        loop>
      </audio>

    </div>

  </div>

  <div
    id="error"
    class="box error hidden">
  </div>

</main>

<script src="config.js"></script>

<script>

const loadingEl = document.getElementById("loading");
const giftEl = document.getElementById("gift");
const titleEl = document.getElementById("title");
const openBtn = document.getElementById("openBtn");
const contentEl = document.getElementById("content");
const photoEl = document.getElementById("photo");
const msgEl = document.getElementById("msg");
const audioEl = document.getElementById("audio");
const errorEl = document.getElementById("error");


// ============================
// KIỂM TRA CONFIG
// ============================

if(
  !window.GIFTBOX_CONFIG ||
  !GIFTBOX_CONFIG.SUPABASE_URL ||
  !GIFTBOX_CONFIG.SUPABASE_KEY
){

  showError(
    "Chưa cấu hình Supabase. Hãy kiểm tra config.js."
  );

}else{

  const sb = supabase.createClient(
    GIFTBOX_CONFIG.SUPABASE_URL,
    GIFTBOX_CONFIG.SUPABASE_KEY
  );

  const params =
    new URLSearchParams(window.location.search);

  const giftId = params.get("id");


  // ============================
  // KIỂM TRA ID
  // ============================

  if(!giftId){

    showError(
      "Link món quà không hợp lệ hoặc bị thiếu ID."
    );

  }else{

    loadGift();
  }


  // ============================
  // LOAD GIFT
  // ============================

  async function loadGift(){

    try{

      console.log("Gift ID:",giftId);

      const result = await sb.rpc(
        "get_gift_public",
        {
          p_id:giftId
        }
      );

      console.log("Supabase:",result);

      const data = result.data;
      const error = result.error;


      if(error){

        console.error(error);

        throw new Error(
          error.message || "Không thể kết nối Supabase."
        );
      }


      if(!data || !data.length){

        throw new Error(
          "Không tìm thấy món quà với ID này."
        );
      }


      const g = data[0];

      console.log("Gift:",g);


      // ============================
      // HIỂN THỊ TRANG BÌA
      // ============================

      titleEl.textContent =
        `${g.occasion || "Happy Birthday"} ${g.recipient || ""} ❤️`;


      // Nội dung lời chúc
      msgEl.textContent =
        g.message || "";


      // ============================
      // ẢNH
      // ============================

      if(g.photo_url){

        photoEl.src = g.photo_url;

        photoEl.classList.remove("hidden");

      }


      // ============================
      // NHẠC
      // ============================

      if(g.music_url){

        audioEl.src = g.music_url;

        audioEl.classList.remove("hidden");

      }


      loadingEl.classList.add("hidden");

      giftEl.classList.remove("hidden");


      // ============================
      // NÚT MỞ QUÀ
      // ============================

      openBtn.addEventListener(
        "click",
        function(){

          console.log("OPEN GIFT");

          openGift();

        }
      );


    }catch(err){

      console.error(
        "GiftBox error:",
        err
      );

      showError(
        "Không thể mở món quà: " +
        (err.message || err)
      );

    }

  }


  // ============================
  // MỞ QUÀ
  // ============================

  function openGift(){

    openBtn.classList.add("hidden");

    contentEl.classList.remove("hidden");

    createHearts();


    // iPhone cho phép play vì hành động này
    // xảy ra trực tiếp sau cú bấm của người dùng.

    if(
      audioEl.src &&
      !audioEl.classList.contains("hidden")
    ){

      audioEl.play().catch(function(err){

        console.log(
          "Không tự phát được nhạc:",
          err
        );

      });

    }

  }

}


// ============================
// HIỂN THỊ LỖI
// ============================

function showError(text){

  loadingEl.classList.add("hidden");

  giftEl.classList.add("hidden");

  errorEl.textContent = text;

  errorEl.classList.remove("hidden");

}


// ============================
// HIỆU ỨNG TIM
// ============================

function createHearts(){

  const icons = [
    "❤️",
    "💗",
    "💖",
    "✨",
    "🌹"
  ];

  for(let i=0;i<60;i++){

    setTimeout(function(){

      const heart =
        document.createElement("div");

      heart.className = "heart";

      heart.textContent =
        icons[
          Math.floor(
            Math.random()*icons.length
          )
        ];

      heart.style.left =
        Math.random()*100 + "vw";

      heart.style.animationDuration =
        (3 + Math.random()*4) + "s";

      document.body.appendChild(heart);

      setTimeout(function(){

        heart.remove();

      },7500);

    },i*45);

  }

}


// ============================
// MATRIX BACKGROUND
// ============================

const canvas =
  document.getElementById("c");

const ctx =
  canvas.getContext("2d");

let w;
let h;
let drops;


function resize(){

  w = canvas.width =
    window.innerWidth;

  h = canvas.height =
    window.innerHeight;

  drops =
    Array(
      Math.ceil(w/14)
    ).fill(1);

}

resize();

window.addEventListener(
  "resize",
  resize
);


setInterval(function(){

  ctx.fillStyle =
    "rgba(3,3,3,.15)";

  ctx.fillRect(
    0,
    0,
    w,
    h
  );

  ctx.fillStyle =
    "#aaa";

  ctx.font =
    "14px monospace";


  drops.forEach(function(y,i){

    const char =
      String.fromCharCode(
        0x30A0 +
        Math.floor(Math.random()*96)
      );

    ctx.fillText(
      char,
      i*14,
      y*14
    );


    if(
      y*14 > h &&
      Math.random() > .975
    ){

      drops[i] = 0;

    }

    drops[i]++;

  });

},55);

</script>

</body>
</html>
