<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b">
<title>GiftBox Pro 🎁</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--a:#ff4d8d;--b:#57172f;--glow:#ff77aa66}*{box-sizing:border-box}body{margin:0;background:#050506;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden;min-height:100vh}.bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 25%,var(--b),transparent 42%),linear-gradient(180deg,#08080b,#020203);z-index:-3}.noise{position:fixed;inset:0;opacity:.07;z-index:-2;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E")}.screen{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(760px,100%);text-align:center}.brand{position:fixed;top:20px;left:20px;font-weight:900;color:#ffffffaa;font-size:13px;letter-spacing:.3px}.eyebrow{font-size:13px;color:#ffffff99;letter-spacing:1.4px;text-transform:uppercase}.title{font-size:clamp(44px,11vw,88px);line-height:.98;letter-spacing:-3px;margin:17px 0 14px;font-weight:950;text-shadow:0 0 50px var(--glow)}.subtitle{font-size:18px;color:#d8d8df;margin:0 auto 27px;max-width:560px;line-height:1.6}.giftBox{width:190px;height:160px;margin:28px auto 35px;position:relative;filter:drop-shadow(0 25px 45px #000)}.base{position:absolute;left:15px;right:15px;bottom:0;height:120px;border-radius:15px;background:linear-gradient(135deg,var(--b),var(--a));border:1px solid #ffffff40}.lid{position:absolute;left:0;right:0;top:15px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--a),#ffd0df);border:1px solid #ffffff50;transform-origin:20% 100%;transition:transform .8s cubic-bezier(.2,.8,.2,1)}.ribbonV{position:absolute;left:82px;top:15px;width:28px;height:145px;background:#ffffffd8}.ribbonH{position:absolute;left:15px;right:15px;top:62px;height:24px;background:#ffffffd8}.giftBox.opened .lid{transform:translate(-22px,-55px) rotate(-18deg)}.btn{border:0;border-radius:999px;padding:15px 26px;font-size:16px;font-weight:900;background:#fff;color:#111;box-shadow:0 10px 35px #0007}.hidden{display:none!important}.content{animation:rise .7s ease both}.photo{width:min(460px,92vw);max-height:48vh;object-fit:cover;border-radius:24px;margin:18px auto;box-shadow:0 25px 80px #000,0 0 55px var(--glow);border:1px solid #ffffff25}.message{font-size:clamp(18px,4vw,23px);line-height:1.8;white-space:pre-line;max-width:650px;margin:22px auto;color:#f2f2f5}.from{margin-top:24px;color:#ffffffa0;font-size:14px}.audio{width:min(430px,90vw);margin-top:18px;opacity:.9}.particle{position:fixed;bottom:-40px;z-index:10;pointer-events:none;animation:floatUp linear forwards}@keyframes floatUp{to{transform:translateY(-120vh) rotate(280deg) scale(1.7);opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}.countdown{display:flex;justify-content:center;gap:9px;margin:25px 0;flex-wrap:wrap}.unit{min-width:72px;padding:14px 10px;background:#ffffff0b;border:1px solid #ffffff18;border-radius:16px}.unit b{font-size:25px;display:block}.unit span{font-size:11px;color:#aaa}.lock{font-size:58px;margin-bottom:15px}.error{color:#ffaaaa}.miniText{font-size:12px;color:#777;margin-top:28px}
</style></head>
<body><div class="bg"></div><div class="noise"></div><div class="brand">🎁 GiftBox Pro</div><main class="screen"><div class="card" id="loading">Đang chuẩn bị món quà... ✨</div><div class="card hidden" id="gate"><div class="lock">🔒</div><div class="eyebrow">Một món quà đang chờ bạn</div><h1 class="title" id="gateTitle">Sắp đến lúc rồi</h1><p class="subtitle">Gift Box này sẽ chỉ mở vào đúng thời điểm người gửi đã chọn.</p><div class="countdown"><div class="unit"><b id="d">0</b><span>NGÀY</span></div><div class="unit"><b id="h">0</b><span>GIỜ</span></div><div class="unit"><b id="m">0</b><span>PHÚT</span></div><div class="unit"><b id="s">0</b><span>GIÂY</span></div></div><div class="miniText" id="openTime"></div></div><div class="card hidden" id="gift"><div id="before"><div class="eyebrow">💌 Một món quà dành riêng cho</div><h1 class="title" id="recipient"></h1><p class="subtitle" id="occasion"></p><div class="giftBox" id="box"><div class="base"></div><div class="ribbonV"></div><div class="ribbonH"></div><div class="lid"></div></div><button class="btn" id="openBtn">Mở món quà 🎁</button></div><div id="content" class="content hidden"><div class="eyebrow" id="giftTitle"></div><img id="photo" class="photo hidden"><div id="message" class="message"></div><div id="from" class="from"></div><audio id="audio" class="audio hidden" controls loop></audio></div></div></main>
<script src="config.js"></script><script>
const cfg=window.GIFTBOX_CONFIG,sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_KEY),id=new URLSearchParams(location.search).get('id'),$=x=>document.getElementById(x);let timer;
const themes={rose:['#ff4d8d','#57172f','#ff77aa66'],midnight:['#6ca6ff','#101c34','#6ca6ff55'],gold:['#eab85a','#4a3008','#eab85a55'],sky:['#65d5ef','#0d4d5d','#65d5ef55'],violet:['#a87bff','#31165b','#a87bff55']};
function applyTheme(t){const v=themes[t]||themes.rose;document.documentElement.style.setProperty('--a',v[0]);document.documentElement.style.setProperty('--b',v[1]);document.documentElement.style.setProperty('--glow',v[2])}
async function init(){if(!id){$('loading').textContent='Link Gift Box không hợp lệ.';return}const {data:gate}=await sb.rpc('get_gift_gate',{p_id:id});if(!gate?.length){$('loading').textContent='Gift Box không tồn tại hoặc không còn hoạt động.';return}const g=gate[0];applyTheme(g.theme);if(g.open_at&&new Date(g.open_at)>new Date()){showGate(g);return}await loadGift()}
function showGate(g){$('loading').classList.add('hidden');$('gate').classList.remove('hidden');$('gateTitle').textContent=`${g.occasion} ${g.recipient} ✨`;$('openTime').textContent='Mở lúc '+new Date(g.open_at).toLocaleString('vi-VN');const tick=()=>{const diff=new Date(g.open_at)-new Date();if(diff<=0){clearInterval(timer);location.reload();return}const sec=Math.floor(diff/1000);$('d').textContent=Math.floor(sec/86400);$('h').textContent=String(Math.floor(sec%86400/3600)).padStart(2,'0');$('m').textContent=String(Math.floor(sec%3600/60)).padStart(2,'0');$('s').textContent=String(sec%60).padStart(2,'0')};tick();timer=setInterval(tick,1000)}
async function loadGift(){const {data,error}=await sb.rpc('get_gift_public',{p_id:id});if(error||!data?.length){$('loading').textContent='Không thể mở Gift Box lúc này.';return}const g=data[0];applyTheme(g.theme);$('recipient').textContent=g.recipient;$('occasion').textContent=g.occasion;$('message').textContent=g.message;$('giftTitle').textContent=g.gift_title||'✨ Dành riêng cho bạn';$('from').textContent=g.sender_name?'— Từ '+g.sender_name:'';if(g.photo_url){$('photo').src=g.photo_url;$('photo').classList.remove('hidden')}if(g.music_url){$('audio').src=g.music_url;$('audio').classList.remove('hidden')}$('loading').classList.add('hidden');$('gift').classList.remove('hidden');$('openBtn').onclick=()=>{$('box').classList.add('opened');$('openBtn').disabled=true;setTimeout(()=>{$('before').classList.add('hidden');$('content').classList.remove('hidden');particles();$('audio').play().catch(()=>{})},700)}}
function particles(){const chars=['✨','💖','🌸','🎉','💫','❤️'];for(let i=0;i<75;i++)setTimeout(()=>{const p=document.createElement('div');p.className='particle';p.textContent=chars[Math.floor(Math.random()*chars.length)];p.style.left=Math.random()*100+'vw';p.style.fontSize=15+Math.random()*25+'px';p.style.animationDuration=3+Math.random()*4+'s';document.body.appendChild(p);setTimeout(()=>p.remove(),7500)},i*35)}init();
</script></body></html>
